services:
  postgres:
    image: postgres:16
    container_name: zapwave-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: zapwave
      POSTGRES_PASSWORD: zapwave
      POSTGRES_DB: zapwave
    volumes:
      - zapwave-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zapwave-redis
    ports:
      - '6379:6379'
    volumes:
      - zapwave-redis:/data

volumes:
  zapwave-pg:
  zapwave-redis:
